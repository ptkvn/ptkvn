# Redraws the snake from this account's contribution graph once a day and
# publishes the SVGs to the `output` branch, which README.md embeds.
name: Generate snake animation

on:
  schedule:
    - cron: "23 0 * * *" # daily at 00:23 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write # needed to push the output branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ HKUST-LongGroup }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
